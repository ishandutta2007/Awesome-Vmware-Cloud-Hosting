<svg fill="none" viewBox="0 0 1200 360" width="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="cardGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.0" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 48px; fill: #FFFFFF; }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 22px; fill: #94A3B8; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #38BDF8; }
    
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.7; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }
    
    @keyframes floatWave {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }

    .background-anim { animation: pulse 6s infinite ease-in-out; transform-origin: center; }
    .wave-anim { animation: floatWave 4s infinite ease-in-out; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="360" rx="16" fill="url(#bg)" />

  <!-- Animated Background Orbs / Grid (Behind text) -->
  <g class="background-anim">
    <circle cx="150" cy="80" r="140" fill="#0284C7" opacity="0.15" filter="blur(40px)" />
    <circle cx="1050" cy="280" r="160" fill="#6366F1" opacity="0.2" filter="blur(50px)" />
  </g>

  <!-- Decorative Wave Grid Lines (Background only) -->
  <path class="wave-anim" d="M0 280 Q 300 220 600 280 T 1200 240 L 1200 360 L 0 360 Z" fill="url(#cardGlow)" />
  
  <!-- Subtle Grid Lines -->
  <g stroke="#334155" stroke-width="1" stroke-dasharray="4 4" opacity="0.3">
    <line x1="100" y1="0" x2="100" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="500" y1="0" x2="500" y2="360" />
    <line x1="700" y1="0" x2="700" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1100" y1="0" x2="1100" y2="360" />
  </g>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)" />

  <!-- Main Content Foreground (Unobstructed, sharp contrast) -->
  <g filter="url(#shadow)">
    <!-- Pill Tag -->
    <rect x="80" y="60" width="260" height="34" rx="17" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" />
    <text x="96" y="82" class="badge-text">⚡ HYBRID CLOUD &amp; VIRTUALIZATION</text>

    <!-- Main Title -->
    <text x="80" y="150" class="title">Awesome VMware Cloud Hosting ☁️</text>

    <!-- Subtitle / Description -->
    <text x="80" y="200" class="subtitle">Curated Managed VMware Platforms, Open-Source Hypervisors &amp; Migration Tooling</text>
    <text x="80" y="235" class="subtitle" font-size="18px" fill="#64748B">Post-Broadcom Migration Options • Proxmox VE • KubeVirt • OpenStack • XCP-ng</text>
  </g>

  <!-- Bottom Badges / Tech Highlights -->
  <g transform="translate(80, 275)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="150" height="32" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
    <text x="16" y="21" font-family="sans-serif" font-size="13px" font-weight="600" fill="#E2E8F0">🚀 15+ SaaS Hosts</text>

    <!-- Badge 2 -->
    <rect x="165" y="0" width="170" height="32" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
    <text x="181" y="21" font-family="sans-serif" font-size="13px" font-weight="600" fill="#E2E8F0">🛠️ Open-Source Stack</text>

    <!-- Badge 3 -->
    <rect x="350" y="0" width="160" height="32" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
    <text x="366" y="21" font-family="sans-serif" font-size="13px" font-weight="600" fill="#E2E8F0">📊 Star &amp; Price Metrics</text>
  </g>
</svg>
